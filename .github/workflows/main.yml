name: Deploy MFC Portal to cPanel Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  tests:
    name: Run Laravel Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: arem_testing
          MYSQL_USER: laravel
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u laravel -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: arem_testing
      DB_USERNAME: laravel
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, intl, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare testing environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run feature tests compact
        run: php artisan test --testsuite=Feature --compact

      - name: Run unit tests compact
        run: php artisan test --testsuite=Unit --compact

  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, intl, pdo_mysql, zip
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Create deployment archive
        run: |
          git archive --format=zip --output=mfc-portal.zip HEAD
          ls -lah mfc-portal.zip

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_rsa \
            -p ${{ secrets.SSH_PORT || 22 }} \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "pwd && whoami && ls -la"

      - name: Upload archive to cPanel
        run: |
          scp -i ~/.ssh/id_rsa \
            -P ${{ secrets.SSH_PORT || 22 }} \
            -o IdentitiesOnly=yes \
            mfc-portal.zip \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/mfc-portal.zip

      - name: Unzip and optimize Laravel on server
        run: |
          ssh -i ~/.ssh/id_rsa \
            -p ${{ secrets.SSH_PORT || 22 }} \
            -o IdentitiesOnly=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_PATH }} && \
             unzip -o mfc-portal.zip && \
             rm mfc-portal.zip && \
             composer install --no-dev --optimize-autoloader --no-interaction && \
             php artisan config:clear && \
             php artisan migrate --force && \
             php artisan optimize:clear && \
             php artisan config:cache && \
             php artisan route:cache"
